[package]
name = "studio-dsp"
description = "Awra Studio: audio buffers, decoding, effects (EQ, compressor, autotune...), mix graph and rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
studio-core.workspace = true
anyhow.workspace = true
rustfft = "6"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "flac", "isomp4", "ogg", "vorbis", "wav", "pcm", "alac", "adpcm"] }
