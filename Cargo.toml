[workspace]
resolver = "2"
members = [
    "crates/studio-core",
    "crates/studio-dsp",
    "crates/studio-analysis",
    "crates/studio-engine",
    "crates/studio-ai",
    "crates/studio-collab",
    "crates/studio-plugins",
    "app",
    "test-plugins/awra-test-gain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Awra Studio contributors"]

[workspace.dependencies]
studio-core = { path = "crates/studio-core" }
studio-dsp = { path = "crates/studio-dsp" }
studio-analysis = { path = "crates/studio-analysis" }
studio-engine = { path = "crates/studio-engine" }
studio-ai = { path = "crates/studio-ai" }
studio-collab = { path = "crates/studio-collab" }
studio-plugins = { path = "crates/studio-plugins" }
awra = { path = "../bindings/rust/awra" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
fastrand = "2"
blake3 = "1"

[profile.release]
debug = false
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
